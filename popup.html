<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gutter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 240px;
      background: #000000;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      user-select: none;
    }

    .header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .wordmark {
      font-size: 10px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
    }

    .mode-badge {
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 2px 7px;
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.3);
    }

    .mode-badge.on {
      border-color: #ffffff;
      color: #ffffff;
      background: rgba(255,255,255,0.05);
    }

    .mode-block {
      padding: 16px;
    }

    .mode-title {
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .mode-desc {
      font-size: 10px;
      color: rgba(255,255,255,0.35);
      line-height: 1.6;
      margin-bottom: 14px;
    }

    /* Big clear toggle */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,0.12);
      cursor: pointer;
      transition: border-color 100ms;
    }

    .toggle-row:hover { border-color: rgba(255,255,255,0.4); }
    .toggle-row.active { border-color: #ffffff; }

    .toggle-label {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .toggle-label.active { color: #ffffff; }
    .toggle-label:not(.active) { color: rgba(255,255,255,0.35); }

    /* Turbo-style switch */
    .switch {
      position: relative;
      width: 36px;
      height: 18px;
    }

    .switch input { display: none; }

    .track {
      position: absolute;
      inset: 0;
      background: #111;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 10px;
      height: 10px;
      background: #444;
      border-top: 1px solid rgba(255,255,255,0.25);
      border-left: 1px solid rgba(255,255,255,0.15);
      transition: left 80ms, background 80ms;
    }

    input:checked ~ .track { border-color: rgba(255,255,255,0.8); }
    input:checked ~ .track .knob {
      left: 21px;
      background: #ffffff;
      border-top: 1px solid rgba(0,0,0,0.3);
      border-left: 1px solid rgba(0,0,0,0.2);
    }

    .footer {
      padding: 10px 16px;
      border-top: 1px solid rgba(255,255,255,0.06);
      font-size: 9px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.08em;
      line-height: 1.5;
    }

    .footer.active { color: rgba(255,255,255,0.5); }
  </style>
</head>
<body>

  <div class="header">
    <span class="wordmark">Gutter</span>
    <span class="mode-badge" id="badge">Standard</span>
  </div>

  <div class="mode-block">
    <div class="mode-title">Deep Dive Mode</div>
    <div class="mode-desc">When ON — reads the page title, headings, and description before answering. Replies are specific to the page you're reading.</div>

    <label class="toggle-row" id="toggle-row">
      <span class="toggle-label" id="toggle-label">Off</span>
      <div class="switch">
        <input type="checkbox" id="dd-toggle">
        <div class="track"><div class="knob"></div></div>
      </div>
    </label>
  </div>

  <div id="usage" style="display:none;padding:8px 16px 0;font-size:9px;color:rgba(255,255,255,0.22);letter-spacing:0.06em;line-height:1.6;border-top:1px solid rgba(255,255,255,0.06);margin-top:4px;padding-top:10px;"></div>

  <div class="footer" id="footer">Alt+Click any heading or selected text to use.</div>

  <script src="popup.js"></script>
</body>
</html>
