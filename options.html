<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gutter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000000;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 360px;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 28px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.8);
    }

    .title {
      font-size: 11px;
      letter-spacing: 0.25em;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 12px;
    }

    label {
      display: block;
      font-size: 10px;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      margin-bottom: 6px;
      margin-top: 16px;
    }

    input {
      width: 100%;
      background: #000000;
      border: 1px solid rgba(255,255,255,0.2);
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      padding: 8px 10px;
      outline: none;
    }
    input:focus { border-color: rgba(255,255,255,0.6); }

    select {
      width: 100%;
      background: #000000;
      border: 1px solid rgba(255,255,255,0.2);
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      padding: 8px 10px;
      outline: none;
      appearance: none;
      cursor: pointer;
    }
    select:focus { border-color: rgba(255,255,255,0.6); }

    .btn-row { display: flex; gap: 10px; margin-top: 16px; }

    button {
      flex: 1;
      background: none;
      border: 1px solid rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.6);
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 9px;
      cursor: pointer;
    }
    button:hover { background: rgba(255,255,255,0.06); color: #ffffff; border-color: rgba(255,255,255,0.5); }
    button.primary { background: rgba(255,255,255,0.08); color: #ffffff; border-color: rgba(255,255,255,0.4); }
    button.primary:hover { background: rgba(255,255,255,0.14); }
    button.danger { border-color: rgba(255,80,80,0.4); color: rgba(255,100,100,0.8); }
    button.danger:hover { background: rgba(255,50,50,0.08); color: #ff8080; border-color: rgba(255,80,80,0.7); }
    button:disabled { opacity: 0.3; cursor: not-allowed; }

    .google-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: none;
      border: 1px solid rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.8);
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 11px;
      cursor: pointer;
    }
    .google-btn:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.5); color: #ffffff; }

    .google-icon { width: 16px; height: 16px; }

    #status {
      font-size: 11px;
      margin-top: 14px;
      min-height: 16px;
      letter-spacing: 0.05em;
    }
    .ok  { color: rgba(100,255,100,0.8); }
    .err { color: rgba(255,100,100,0.8); }

    .user-email {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 20px;
      letter-spacing: 0.05em;
      word-break: break-all;
    }

    .key-status {
      font-size: 11px;
      color: rgba(100,255,100,0.8);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .key-status::before { content: '✓'; }

    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.1);
      margin: 20px 0;
    }

    #logged-in  { display: none; }
    #logged-out { display: block; }

    .deep-dive-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,0.12);
      margin-bottom: 20px;
      cursor: pointer;
      transition: border-color 100ms;
    }
    .deep-dive-row:hover { border-color: rgba(255,255,255,0.4); }
    .deep-dive-row.dd-on { border-color: #ffffff; }

    .dd-text { display: flex; flex-direction: column; gap: 3px; }
    .dd-name { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #ffffff; }
    .dd-sub  { font-size: 9px; color: rgba(255,255,255,0.3); letter-spacing: 0.06em; }
    .dd-sub.dd-on { color: rgba(255,255,255,0.6); }

    .dd-switch { position: relative; width: 38px; height: 20px; flex-shrink: 0; }
    .dd-switch input { display: none; }
    .dd-track {
      position: absolute; inset: 0;
      background: #111;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .dd-knob {
      position: absolute; top: 3px; left: 3px;
      width: 12px; height: 12px;
      background: #333;
      border-top: 1px solid rgba(255,255,255,0.2);
      transition: left 80ms, background 80ms;
    }
    .dd-switch input:checked ~ .dd-track { border-color: rgba(255,255,255,0.8); }
    .dd-switch input:checked ~ .dd-track .dd-knob {
      left: 21px; background: #ffffff;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">Gutter // Settings</div>

    <!-- Deep Dive toggle — always visible -->
    <label class="deep-dive-row" id="dd-row">
      <div class="dd-text">
        <span class="dd-name">Deep Dive Mode</span>
        <span class="dd-sub" id="dd-sub">Off — standard two-sentence reply</span>
      </div>
      <div class="dd-switch">
        <input type="checkbox" id="dd-toggle">
        <div class="dd-track"><div class="dd-knob"></div></div>
      </div>
    </label>

    <!-- Logged out -->
    <div id="logged-out">
      <button class="google-btn" id="btn-google">
        <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign in with Google
      </button>
    </div>

    <!-- Logged in -->
    <div id="logged-in">
      <div class="user-email" id="user-email"></div>

      <!-- Key configured -->
      <div id="key-configured" style="display:none">
        <div class="key-status" id="key-status-text">API key configured</div>
        <div class="btn-row">
          <button class="danger" id="btn-remove-key">Remove Key</button>
        </div>
      </div>

      <!-- No key yet -->
      <div id="key-missing">
        <label>AI Provider</label>
        <select id="provider">
          <option value="gemini">Gemini (Google)</option>
          <option value="openai">OpenAI</option>
          <option value="claude">Claude (Anthropic)</option>
          <option value="grok">Grok (xAI)</option>
        </select>
        <label>API Key</label>
        <input type="password" id="api-key" placeholder="AIzaSy..." autocomplete="off" />
        <div class="btn-row">
          <button class="primary" id="btn-save-key">Save Key</button>
        </div>
      </div>

      <hr class="divider">

      <div class="btn-row">
        <button class="danger" id="btn-logout">Logout</button>
      </div>
    </div>

    <div id="status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
