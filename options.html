<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gutter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #03030f;
      color: #b8b8ff;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 360px;
      border: 1px solid #4a4aff;
      padding: 28px;
      box-shadow: 0 0 16px rgba(80,80,255,0.3), 0 0 40px rgba(50,50,200,0.1);
    }

    .title {
      font-size: 11px;
      letter-spacing: 0.25em;
      color: #6666ff;
      text-transform: uppercase;
      margin-bottom: 24px;
      border-bottom: 1px solid #1e1e6e;
      padding-bottom: 12px;
    }

    label {
      display: block;
      font-size: 10px;
      letter-spacing: 0.15em;
      color: #5555cc;
      text-transform: uppercase;
      margin-bottom: 6px;
      margin-top: 16px;
    }

    input {
      width: 100%;
      background: #000008;
      border: 1px solid #2a2a88;
      color: #b8b8ff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      padding: 8px 10px;
      outline: none;
    }
    input:focus { border-color: #4a4aff; }

    .btn-row { display: flex; gap: 10px; margin-top: 16px; }

    button {
      flex: 1;
      background: none;
      border: 1px solid #4a4aff;
      color: #6666ff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 9px;
      cursor: pointer;
    }
    button:hover { background: #111144; color: #ffffff; }
    button.primary { background: #1a1a6e; color: #b8b8ff; border-color: #6666ff; }
    button.primary:hover { background: #2a2a99; }
    button.danger { border-color: #aa2222; color: #cc4444; }
    button.danger:hover { background: #2a0808; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .google-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #0f0f2e;
      border: 1px solid #4a4aff;
      color: #b8b8ff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 11px;
      cursor: pointer;
    }
    .google-btn:hover { background: #1a1a55; }

    .google-icon { width: 16px; height: 16px; }

    #status {
      font-size: 11px;
      margin-top: 14px;
      min-height: 16px;
      letter-spacing: 0.05em;
    }
    .ok  { color: #44aa44; }
    .err { color: #cc4444; }

    .user-email {
      font-size: 11px;
      color: #5555cc;
      margin-bottom: 20px;
      letter-spacing: 0.05em;
      word-break: break-all;
    }

    .key-status {
      font-size: 11px;
      color: #44aa44;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .key-status::before { content: '✓'; }

    .divider {
      border: none;
      border-top: 1px solid #1e1e6e;
      margin: 20px 0;
    }

    #logged-in  { display: none; }
    #logged-out { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">Gutter // Settings</div>

    <!-- Logged out -->
    <div id="logged-out">
      <button class="google-btn" id="btn-google">
        <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign in with Google
      </button>
    </div>

    <!-- Logged in -->
    <div id="logged-in">
      <div class="user-email" id="user-email"></div>

      <!-- Key configured -->
      <div id="key-configured" style="display:none">
        <div class="key-status">Gemini API key configured</div>
        <div class="btn-row">
          <button class="danger" id="btn-remove-key">Remove Key</button>
        </div>
      </div>

      <!-- No key yet -->
      <div id="key-missing">
        <label>Gemini API Key</label>
        <input type="password" id="api-key" placeholder="AIzaSy..." autocomplete="off" />
        <div class="btn-row">
          <button class="primary" id="btn-save-key">Save Key</button>
        </div>
      </div>

      <hr class="divider">

      <div class="btn-row">
        <button class="danger" id="btn-logout">Logout</button>
      </div>
    </div>

    <div id="status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
